name: 新增风格
description: 提交一条新的图像风格 / 提示词
labels: ["new-style"]
body:
  - type: input
    id: title
    attributes:
      label: 风格名称
      placeholder: 默片拼贴海报
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: 分类
      placeholder: 海报排版——模板 / 生图风格——模板 / MJ风格及事例 …
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: 适用模型
      options:
        - Midjourney
        - GPT-Image
        - 即梦
        - 可灵
        - Niji
        - 通用
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: 提示词原文
      description: 原样粘贴，不用改写
      render: text
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: 效果图
      description: 直接把图片拖进来上传（尽量 1 张代表图）
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签
      placeholder: 海报, 拼贴, 竖图
  - type: textarea
    id: note
    attributes:
      label: 备注
      placeholder: 参数、适用场景、注意事项
