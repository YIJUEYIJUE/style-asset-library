name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Check app.js syntax
        run: node --check app.js
      - name: Validate data
        run: python3 scripts/validate.py
      - name: Check README stats are up to date
        run: python3 scripts/gen_stats.py --check
      - name: Check i18n key algorithm parity (app.js vs merge_i18n.py)
        run: python3 scripts/check_i18n_key_parity.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 分片是 styles.json 的派生产物，每次部署现做，不进仓库（永不失同步）
      - name: Build data shards
        run: python3 scripts/split_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
